# Example only — do not commit real values. Create the real Secret with:
#
#   python - <<'EOF'
#   import secrets; print(secrets.token_hex(32))
#   EOF
#   uv run python -m gallery.passwd alice > users.yaml   # repeat per user
#   kubectl create secret generic gallery-auth \
#     --from-literal=secret-key=<generated-hex> \
#     --from-file=users.yaml=users.yaml
apiVersion: v1
kind: Secret
metadata:
  name: gallery-auth
type: Opaque
stringData:
  secret-key: replace-me-64-hex-chars
  users.yaml: |
    # username: pbkdf2 hash — generate with `python -m gallery.passwd <name>`
    alice: pbkdf2_sha256$390000$replace$me
