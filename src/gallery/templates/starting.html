<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting {{ title }}…</title>
<script>
  const saved = localStorage.getItem("gallery-theme");
  document.documentElement.dataset.theme =
    saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<style>
  :root { --bg: #f7f7f8; --fg: #1a1a1e; --muted: #6b6b76; --accent: #0072b2; --card: #ffffff; }
  :root[data-theme="dark"] { --bg: #131318; --fg: #e8e8ec; --muted: #9a9aa6; --accent: #56b4e9; --card: #1d1d24; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, sans-serif;
  }
  .panel { background: var(--card); border-radius: 12px; padding: 2.5rem 3rem; text-align: center;
           box-shadow: 0 4px 24px rgb(0 0 0 / 0.12); max-width: 34rem; }
  .spinner { width: 2.5rem; height: 2.5rem; margin: 0 auto 1rem; border-radius: 50%;
             border: 3px solid var(--muted); border-top-color: var(--accent);
             animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .muted { color: var(--muted); font-size: 0.9rem; }
  pre { text-align: left; white-space: pre-wrap; color: #d55e00; font-size: 0.8rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="panel">
  <div class="spinner" id="spinner"></div>
  <h1 style="font-size:1.3rem; margin:0 0 .5rem">Starting {{ title }}</h1>
  <p class="muted" id="status">
    Booting the notebook server…
    {% if sandbox %}This notebook runs in an isolated environment; the first
    launch may take a few minutes while dependencies install.{% endif %}
  </p>
  <p class="muted"><span id="elapsed">0</span>s elapsed · <a href="/">back to gallery</a></p>
  <pre id="error" hidden></pre>
</div>
<script>
  const slug = {{ slug | tojson }};
  const started = Date.now();
  setInterval(() => {
    document.getElementById("elapsed").textContent = Math.round((Date.now() - started) / 1000);
  }, 1000);
  async function poll() {
    try {
      const res = await fetch(`/api/apps/${slug}/status`);
      const data = await res.json();
      if (data.state === "running") { location.reload(); return; }
      if (data.state === "failed") {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("status").textContent = "The notebook failed to start.";
        const err = document.getElementById("error");
        err.hidden = false;
        err.textContent = data.error || "unknown error";
        return;
      }
    } catch (e) { /* gateway hiccup; keep polling */ }
    setTimeout(poll, 1000);
  }
  poll();
</script>
</body>
</html>
