<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Notebook Gallery</title>
<script>
  const saved = localStorage.getItem("gallery-theme");
  document.documentElement.dataset.theme =
    saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<link rel="stylesheet" href="/static/gallery.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; }
  .login-panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow-hover); padding: 2rem 2.5rem; width: min(22rem, 90vw);
  }
  .login-panel h1 { font-size: 1.2rem; margin: 0 0 1rem; }
  .login-panel label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.8rem 0 0.25rem; }
  .login-panel input {
    width: 100%; padding: 0.5rem 0.7rem; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); color: var(--fg);
  }
  .login-panel button[type="submit"] {
    margin-top: 1.2rem; width: 100%; padding: 0.55rem; border: none; border-radius: 8px;
    background: var(--accent); color: var(--accent-fg); font-weight: 600; cursor: pointer;
  }
  .error { color: #d55e00; font-size: 0.85rem; margin: 0.8rem 0 0; }
  .back { display: block; text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<form class="login-panel" method="post" action="/login">
  <h1>Log in</h1>
  <input type="hidden" name="next" value="{{ next }}">
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button type="submit">Sign in</button>
  <a class="back" href="/">← back to gallery</a>
</form>
</body>
</html>
