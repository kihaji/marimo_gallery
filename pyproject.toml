[project]
name = "marimo-gallery"
version = "0.1.0"
description = "A gallery of marimo notebooks served as apps behind a FastAPI gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "websockets>=13",
    "pyyaml>=6",
    "pydantic>=2.7",
    "pydantic-settings>=2",
    "marimo>=0.13",
    "pandas>=2.2",
    "altair>=5.3",
    "itsdangerous>=2.2.0",
    "croniter>=6.2.4",
]

[project.optional-dependencies]
redis = ["redis>=5"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gallery", "src/gallery_shared"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: spawns real marimo subprocesses"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
